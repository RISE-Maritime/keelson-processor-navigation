name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # keelson is the exact published version pinned in pyproject.toml, as locally. Building it
      # from keelson `dev` tested against a tree without navigation_control/v1 and failed from
      # 2026-09-19 on.
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check bin/ src/ tests/
          .venv/bin/ruff format --check bin/ src/ tests/

      - name: Test
        run: .venv/bin/pytest -v
