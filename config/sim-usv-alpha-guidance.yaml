# Software in the loop ONLY: guidance sails Slipway's sim-usv-alpha on scenario alpha-navigation.
#
#   navigation --config config/sim-usv-alpha-guidance.yaml --connect tcp/localhost:7447
#
# It commands a vessel. Run it only against a Slipway kernel you started, with the
# keelson-processor-autopilot container for sim-usv-alpha stopped. The authority level is fixed
# here because Slipway runs no operational_authority aggregator; every navigation_state says so.

realm: rise
entity_id: sim-usv-alpha
source_base: navigation/0
codec: rider

modules:
  route_monitor: true
  traffic: false
  colreg: false
  guidance: true
  conduct: true
  decision_log: true
  control: true

control:
  # Slipway loads her route at tick 0 while nobody holds the conn (ADR-0093 in Slipway); this
  # processor then takes the free conn and sails it. An operator taking the conn still outranks it.
  controllers: [slipway]

inputs:
  location_fix: gnss
  heading_true_north_deg: slipway
  course_over_ground_deg: slipway
  speed_over_ground_knots: slipway
  yaw_rate_degps: slipway

conduct:
  take_conn_when_free: true
  fixed_authority_level: AUTHORITY_LEVEL_REMOTE_CONTROLLED

guidance:
  responder_id: slipway           # the Slipway kernel's source id (6a6f555)
  full_ahead_sog_knots: 20.5       # alpha 2.0.0 cruises at 20.5 kn at 100 %
  default_sog_knots: 8
