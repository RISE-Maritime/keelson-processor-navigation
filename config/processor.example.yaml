# keelson-processor-navigation configuration.
# Precedence, lowest first: built-in defaults < this file < CLI flags.

realm: rise

# REQUIRED. The vessel this processor navigates. Every subject is read and published under it.
# No default on purpose: a wrong entity id navigates the wrong ship.
entity_id: slipway-alpha

# Each module publishes under "{source_base}/{module}", so each decision has its own source.
source_base: navigation/0

# rider: draft subjects (navigation_state, ...) ride raw_json until keelson types them.
# proto: every subject is published as its keelson protobuf type. Only valid once the installed
#        keelson SDK registers all draft subjects.
codec: rider

tick_hz: 10
state_hz: 1

# Enabling a module that is not implemented in this version is a configuration error.
modules:
  route_monitor: true
  traffic: true
  colreg: true
  guidance: false
  conduct: true
  decision_log: false

# The source_id each input is read from, under entity_id. No wildcard default: a vessel can publish
# one subject from several sources. Simulator ground truth ("truth") is refused.
# Unlisted envelope subjects are reported as unmeasured.
# These values match Slipway's slipway-alpha: position from slipway-gnss, the rest from the kernel.
inputs:
  location_fix: gnss
  heading_true_north_deg: sim
  course_over_ground_deg: sim
  speed_over_ground_knots: sim
  # roll_deg:
  # true_wind_speed_mps:
  # true_wind_speed_max_mps:
  # wave_height_significant_m:
  # visibility_range_m:

route_monitor:
  execution_hz: 1                  # route_execution rate
  max_state_age_s: 3               # own-ship inputs older than this are not used
  measurement_max_age_s: 30        # envelope inputs older than this are unmeasured
  declared_stale_s: 35             # a declared route unheard this long is not monitored
  monitor_declared_route: true     # with no voyage, monitor route/{source} declarations
  arrival_radius_m: 50             # capture radius when a waypoint has no radius_m
  reacquire_margin_m: 100          # a later leg must be this much closer to jump to it
  min_sog_for_eta_knots: 0.5
  xtd_limit_fallback_m: 50         # when a leg authors no XTD limit
  deviation_clear_fraction: 0.8    # deviation alarm clears below this fraction of the limit
  envelope_clear_margin: 0.02      # exceedance closes this fraction inside the limit
  alarms: true
  alarm_republish_s: 5
  alarm_ttl_s: 15

traffic:
  # Where targets come from: an entity and a source publishing under @target. Real AIS on the RISE
  # bus is published under entity maritimedb. A Slipway run with background traffic publishes
  # its contacts under its own traffic entity instead.
  feeds:
    - entity: maritimedb
      source: srv-herakles/sjofartsverket
    - entity: maritimedb
      source: digitraffic
  range_limit_m: 22224             # 12 NM; targets beyond are not published
  range_exit_factor: 1.1           # a target leaves only beyond 1.1 x the limit
  target_max_age_s: 180            # position older than this: target dropped
  static_max_age_s: 1800           # name and dimensions (AIS msg 5 every 6 min)
  publish_hz: 1
  dead_reckon: true                # move each target along its reported velocity since receipt
  exclude_targets: []              # e.g. [mmsi_265000000], this vessel's own AIS

colreg:
  # ADVISORY ONLY. Publishes encounters, advice and dispositions; commands nothing.
  # Thresholds come from the current leg's operational context; with no route, or a leg without one,
  # this context is used. Built-in per-context values live in src/nav/colreg/risk.py.
  default_context: OPERATIONAL_CONTEXT_COASTAL
  thresholds: {}                   # e.g. OPERATIONAL_CONTEXT_PORT_AREA: {cpa_m: 150, tcpa_s: 240, danger_cpa_m: 80, danger_tcpa_s: 120}
  clear_margin: 1.2                # a grade is left only beyond 1.2 x its threshold
  advice_validity_s: 30
  advice_restate_s: 5
  restricted_visibility_m: 1852    # below this (visibility_range_m input), Rule 19 applies
  min_alteration_deg: 30           # Rule 8: readily apparent
  max_alteration_deg: 90
  alteration_step_deg: 10
  speed_factors: [0.5, 0.25]
  horizon_s: 1800
  alarms: true
