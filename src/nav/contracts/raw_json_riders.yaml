# Everything keelson-processor-navigation publishes as JSON on keelson's `raw_json` subject.
#
# Same discipline as SLIPWAY/contracts/raw-json-riders.yaml: this is a debt list and it shrinks.
# A rider is added only with the upstream check recorded (which keelson was searched, when, what
# was found), because the failure it prevents is inventing JSON for something keelson types.
#
# Wire format on raw_json (keelson.TimestampedString.value):
#   {"record": "<record>", "rider_version": 1, "payload": {<protobuf JSON of `message`>}}
# published under the owning module's source id, "{source_base}/{module}".
#
# retire_when.status:
#   awaiting_upstream  keelson has no subject for it. tests/test_riders.py fails the moment the
#                      installed keelson registers it, so an SDK bump cannot leave JSON in place.
#   available          keelson has it; switch the codec to proto and delete this entry.

version: 1

riders:
  - record: navigation_setpoint
    module: guidance
    message: keelson.NavigationSetpoint
    draft_proto: docs/upstream/NavigationSetpoint.proto
    upstream:
      checked_version: "keelson dev @ 7b2438d"
      checked_date: "2026-09-14"
      citation: >-
        subjects.yaml has the actuator values (joystick_x_pct, joystick_y_pct, wheel_position_pct)
        and vehicle_navigation/v1 targets, which are the commands themselves. Nothing records the
        setpoint behind them: the course and speed guidance aimed for, the leg, and the advice it
        executed. docs/PLAN.md §3.
    retire_when:
      subject: navigation_setpoint
      status: awaiting_upstream

  - record: navigation_decision
    module: decision_log
    message: keelson.NavigationDecision
    draft_proto: docs/upstream/NavigationDecision.proto
    upstream:
      checked_version: "keelson dev @ 7b2438d"
      checked_date: "2026-09-14"
      citation: >-
        subjects.yaml has command_authority and command_request (the lease itself) and alarm, and
        no append-only record of a navigation decision with its inputs: why a mode changed, the
        conn was taken or lost, or advice was accepted. docs/PLAN.md §3.
    retire_when:
      subject: navigation_decision
      status: awaiting_upstream
