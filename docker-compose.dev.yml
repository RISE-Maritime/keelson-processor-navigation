# Dev variant on a bridge network; reaches the host router via host.docker.internal (Linux too).
services:
  navigation:
    build:
      context: .
      network: host
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config:ro
    command: ["--config", "/config/processor.yaml", "--connect", "tcp/host.docker.internal:7447"]
