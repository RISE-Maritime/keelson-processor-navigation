# Runs the navigation processor against an ALREADY-RUNNING keelson router on the host
# (tcp/localhost:7447). This stack never starts its own router.
#
# Copy config/processor.example.yaml to config/processor.yaml and set entity_id to the vessel
# this processor navigates before starting. There is deliberately no default entity: publishing
# under the wrong vessel is navigating the wrong ship.
services:
  navigation:
    build:
      context: .
      network: host
    init: true
    network_mode: host
    volumes:
      - ./config:/config:ro
    command: ["--config", "/config/processor.yaml", "--connect", "tcp/localhost:7447"]
